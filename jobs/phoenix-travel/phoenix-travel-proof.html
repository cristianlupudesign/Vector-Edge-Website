        s += infoSvg(box(sl + 12, Math.max(archTop + 30, low + 4), Le - 16, lt - 6), { phone: true, web: true });
      } else {
        s += logoSvg(box(bp + 10, Math.max(archTop + 30, low), Le - 14, Ht - 22), 1);
        s += oneLine(box(bp + 30, archTop + 6, Le - 34, archTop + 26), [B.phone, B.web].filter(Boolean).join('   ·   '), BODYB, COL.dark);
      }
    }
    if (has(o, 'topline')) s += oneLine(V.topLine ? box(Math.max(bp + 10, V.roofX + 30), V.topLine[0], Le - 16, V.topLine[1]) : box(Math.max(bp + 10, V.roofX + 30), Ht - 14, Le - 16, Ht - 4), topText(), BODYB, COL.dark);
    if (o.custom) s += customSvg(o.custom.side, { L, Hh, box, flip });
    if (o.style) s += styleSide(o, { L, archTop, xdf, bp, sl, belt, trimTop, Ht, Le, low, X, Y, pt, box, rect, poly, flip, id });
    const busy = has(o, 'headline') || has(o, 'biglogo') || has(o, 'panel') || !!o.style || !!o.custom;
    if (!busy) {
      let lb = box(bp + 12, belt + 8, sl - 8, Ht - 14), ib = box(sl + 10, belt + 8, Le - 22, Ht - 14);
      if (has(o, 'icon')) { const ie = TPL ? sl - 8 : L - iconS - 30; lb = box(bp + 12, belt + 30, ie, Ht - 14); ib = box(bp + 12, archTop + 6, ie, belt + 24); }
      if (!has(o, 'logo')) ib = box(sl + 10, belt + 8, Le - 22, belt + 60);
      if (has(o, 'logo')) s += logoSvg(lb, o.logo || 1);
      s += infoSvg(ib, { band: has(o, 'services'), services: has(o, 'services'), phone: has(o, 'phone'), web: has(o, 'web') });
    }
    if (has(o, 'cab') && !has(o, 'slash')) s += infoSvg(box(xdf + 8, archTop + 4, bp - 32, belt - 6), { phone: true, web: has(o, 'web'), webMax: 1 });
    if (TPL) return s + `</g><use href="#tpl-${vw}-lines"/>`;
    // ---- panel lines and details ----
    s += line([[xdf, b + 6], [xdf, hh - 2], [ax(hh + 4) - 4, hh + 4]]);
    s += line([[bp, b + 6], [bp, Hh - 12]]);
    if (slider) { s += line([[bp + 5, b + 6], [bp + 5, Hh - 12]]); s += line([[sl, b + 6], [sl, Hh - 12]]); s += line([[sl, belt - 3], [L - 14, belt - 3]], 'stroke-width="1.6"'); }
    else s += line([[sl, b + 26], [sl, Hh - 12]], 'opacity=".45"');
    s += line([[V.roofX + 14, Hh - 6], [L - 8, Hh - 6]], 'opacity=".5"');
    s += rect(bp - 28, belt - 15, bp - 14, belt - 11, '#4b5458', 'rx="1"');
    if (slider) s += rect(bp + 10, belt - 15, bp + 24, belt - 11, '#4b5458', 'rx="1"');
    s += poly([[V.hoodX + 8, belt - 3], [V.hoodX + 24, belt - 3], [V.hoodX + 24, belt + 19], [V.hoodX + 10, belt + 19]], '#3a4246');
    s += poly([[3, hh - 30], [22, hh - 20], [28, hh - 10], [12, hh - 8]], '#eef3f5', `stroke="${LINE}" stroke-width=".6"`);
    s += rect(L - 5, 60, L + .5, 60 + .28 * Hh, '#d1392b');
    [fa, ra].forEach(a => {
      const cx = r2(X(a)), cy = r2(Y(r));
      s += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="#1b1d1f"/><circle cx="${cx}" cy="${cy}" r="${r2(r * .6)}" fill="#cdd3d6" stroke="#9aa3a7" stroke-width=".8"/><circle cx="${cx}" cy="${cy}" r="${r2(r * .2)}" fill="#a7b0b4"/>`;
      for (let i = 0; i < 5; i++) { const t = i * 2 * Math.PI / 5; s += `<circle cx="${r2(X(a) + Math.cos(t) * r * .38)}" cy="${r2(Y(r) + Math.sin(t) * r * .38)}" r="1.6" fill="#7d878b"/>`; }
    });
    return s;
  }

  function rear(o) {
    useStyle(o);
    const w = V.rw, Hh = V.H, b = V.rb || 30, Y = h => Hh - h, cx = w / 2;
    const R = (x0, h0, x1, h1, fill, extra) => `<rect x="${r2(x0)}" y="${r2(Y(h1))}" width="${r2(x1 - x0)}" height="${r2(h1 - h0)}" fill="${fill}" ${extra || ''}/>`;
    const box = (x0, h0, x1, h1) => ({ x: x0, y: Y(h1), w: x1 - x0, h: h1 - h0 });
    let s = TPL ? `<use href="#tpl-rear-base"/>${tplPaint('rear')}<g mask="url(#tpl-rear-m)">` : `<ellipse cx="${cx}" cy="${Y(0) + 1}" rx="${w * .55}" ry="4" fill="#000" opacity=".1"/>`;
    if (!TPL) s += R(14, 0, 44, 28, '#1b1d1f', 'rx="4"') + R(w - 44, 0, w - 14, 28, '#1b1d1f', 'rx="4"');
    if (!TPL) s += `<path d="M0,${Y(b)} L0,${Y(Hh - 12)} Q0,${Y(Hh)} 12,${Y(Hh)} L${w - 12},${Y(Hh)} Q${w},${Y(Hh)} ${w},${Y(Hh - 12)} L${w},${Y(b)} Z" fill="${paint}" stroke="${LINE}" stroke-width=".8"/>`;
    const win = J.van.rearWindows, top = win ? Hh - 86 : Hh - 22, low = has(o, 'swoosh') ? b + 46 : b + 32;
    if (win && !TPL) s += R(20, Hh - 80, cx - 8, Hh - 24, GLASS, `stroke="${LINE}" stroke-width=".7" rx="3"`) + R(cx + 8, Hh - 80, w - 20, Hh - 24, GLASS, `stroke="${LINE}" stroke-width=".7" rx="3"`);
    if (has(o, 'swoosh')) s += R(12, b + 27, w - 12, b + 35, COL.dark) + R(12, b + 38, w - 12, b + 42, COL.main);
    if (has(o, 'line')) s += R(12, b + 30, w - 12, b + 36, COL.main) + R(12, b + 38, w - 12, b + 40.5, COL.dark);
    if (has(o, 'slash')) {
      const hb = b + 26, ht = b + 56, k = .7;
      [[16, 30, 1, COL.main], [52, 14, .7, COL.dark], [74, 26, 1, ACC()], [w - 70, 34, .85, COL.main]].forEach(([x, ww, t, c]) => {
        const top = hb + t * (ht - hb), d = (top - hb) * k;
        if (x + ww + d < w - 12) s += `<polygon points="${r2(x)},${r2(Y(hb))} ${r2(x + ww)},${r2(Y(hb))} ${r2(x + ww + d)},${r2(Y(top))} ${r2(x + d)},${r2(Y(top))}" fill="${c}"/>`;
      });
    }
    if (o.custom) s += customSvg(o.custom.rear, { L: w, Hh, box, flip: false });
    else if (o.style) { if (has(o, 'rear')) s += styleRear(o, { w, Hh, b, Y, box }); }
    else if (has(o, 'panel') && has(o, 'rear')) {
      const pt0 = Math.max(low + 30, top - 62), gid = 'rp' + (++uid);
      s += `<defs><linearGradient id="${gid}" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="${COL.dark}"/><stop offset="1" stop-color="${COL.main}"/></linearGradient></defs>`;
      s += R(18, pt0, w - 18, top, `url(#${gid})`, 'rx="5"');
      s += logoPlate(box(24, pt0 + (top - pt0) * .38, w - 24, top - 4), .9);
      s += infoSvg(box(24, pt0 + 4, w - 24, pt0 + (top - pt0) * .36), { phone: true, ink: '#FFFFFF' });
    } else if (has(o, 'rear')) {
      const bw = cx - 26, bh = Math.min(top - low, bw * 1.05);
      if (has(o, 'logo') || has(o, 'biglogo') || has(o, 'headline')) {
        s += logoSvg(box(18, top - bh, cx - 8, top), .92);
        s += infoSvg(box(cx + 8, top - bh, w - 18, top), { band: has(o, 'services'), services: has(o, 'services'), phone: true, web: has(o, 'web') });
      } else s += infoSvg(box(24, top - bh * .6, w - 24, top), { phone: true, web: has(o, 'web') });
    }
    if (TPL) return s + `</g><use href="#tpl-rear-lines"/>`;
    s += R(12, b + 24, w - 12, Hh - 10, 'none', `stroke="${LINE}" stroke-width=".7" rx="2"`);
    s += `<line x1="${cx}" y1="${Y(b + 24)}" x2="${cx}" y2="${Y(Hh - 10)}" stroke="${LINE}" stroke-width="1"/>`;
    s += R(cx + 4, Hh * .45, cx + 16, Hh * .45 + 3, '#4b5458', 'rx="1"');
    s += R(1, b + 40, 9, b + 40 + Hh * .3, '#d1392b') + R(w - 9, b + 40, w - 1, b + 40 + Hh * .3, '#d1392b') + R(cx - 10, Hh - 6, cx + 10, Hh - 3, '#d1392b');
    s += R(-2, b - 4, w + 2, b + 22, TRIM, 'rx="3"') + R(cx - 26, b + 5, cx + 26, b + 16, '#f4c81a', 'stroke="#6b6b6b" stroke-width=".5"');
    return s;
  }

  function front(o) {
    useStyle(o);
    const w = V.rw, Hh = V.H, b = 30, Y = h => Hh - h, cx = w / 2, hh = V.hoodH, belt = V.belt;
    const P = pts => pts.map(p => `${r2(p[0])},${r2(Y(p[1]))}`).join(' ');
    const R = (x0, h0, x1, h1, fill, extra) => `<rect x="${r2(x0)}" y="${r2(Y(h1))}" width="${r2(x1 - x0)}" height="${r2(h1 - h0)}" fill="${fill}" ${extra || ''}/>`;
    const wsTop = V.wsTop || Math.min(Hh - 16, hh + 95);
    if (TPL) {
      let t = `<use href="#tpl-front-base"/>${tplPaint('front')}<use href="#tpl-front-lines"/>`;
      if (has(o, 'screen')) t += screen();
      if (o.custom && o.custom.front) t += `<g mask="url(#tpl-front-m)">` + customSvg(o.custom.front, { L: w, Hh, box: (x0, h0, x1, h1) => ({ x: x0, y: Y(h1), w: x1 - x0, h: h1 - h0 }), flip: false }) + '</g>';
      if (has(o, 'bonnet')) t += `<g mask="url(#tpl-front-m)">` + logoSvg({ x: w * .27, y: Y(V.bonnetH || hh + 3), w: w * .46, h: 22 }, .9) + `</g>`;
      return t;
    }
    let s = `<ellipse cx="${cx}" cy="${Y(0) + 1}" rx="${w * .55}" ry="4" fill="#000" opacity=".1"/>`;
    s += R(14, 0, 44, 30, '#1b1d1f', 'rx="4"') + R(w - 44, 0, w - 14, 30, '#1b1d1f', 'rx="4"');
    s += `<polygon points="${P([[8, b], [3, hh - 22], [6, hh + 6], [w * .07, Hh - 14], [w * .1, Hh - 2], [w * .17, Hh], [w * .83, Hh], [w * .9, Hh - 2], [w * .93, Hh - 14], [w - 6, hh + 6], [w - 3, hh - 22], [w - 8, b]])}" fill="${paint}" stroke="${LINE}" stroke-width=".8" stroke-linejoin="round"/>`;
    s += `<polygon points="${P([[w * .12, hh + 8], [w * .88, hh + 8], [w * .85, wsTop], [w * .15, wsTop]])}" fill="${GLASS}" stroke="${LINE}" stroke-width=".7"/>`;
    s += `<path d="M${r2(w * .06)},${Y(hh + 4)} Q${cx},${Y(hh + 9)} ${r2(w * .94)},${Y(hh + 4)}" fill="none" stroke="${LINE}" stroke-width=".7"/>`;
    s += R(w * .24, hh - 46, w * .76, hh - 22, '#2b3134', 'rx="3"');
    s += `<polygon points="${P([[w * .05, hh - 40], [w * .22, hh - 40], [w * .22, hh - 22], [w * .07, hh - 24]])}" fill="#eef3f5" stroke="${LINE}" stroke-width=".6"/>`;
    s += `<polygon points="${P([[w * .95, hh - 40], [w * .78, hh - 40], [w * .78, hh - 22], [w * .93, hh - 24]])}" fill="#eef3f5" stroke="${LINE}" stroke-width=".6"/>`;
    s += R(2, b, w - 2, b + 30, TRIM, 'rx="3"') + R(cx - 26, b + 9, cx + 26, b + 20, '#ffffff', 'stroke="#6b6b6b" stroke-width=".5"');
    s += R(-20, belt, -3, belt + 26, '#3a4246', 'rx="3"') + R(w + 3, belt, w + 20, belt + 26, '#3a4246', 'rx="3"');
    function screen() {
      const x0 = w * (V.wsX0 || .16), x1 = w * (V.wsX1 || .84), h0 = wsTop - 15, h1 = wsTop - 1, t = (B.name || J.customer || '').toUpperCase();
      const fill = [COL.dark, COL.main, '#141414'].sort((a, c) => contrast(c, GLASS) - contrast(a, GLASS))[0];
      const sz = fit(t, COND, (x1 - x0) * .86, (h1 - h0) * .62, .08);
      return R(x0, h0, x1, h1, fill) + T(t, cx, Y(h0) - (h1 - h0) / 2 + sz * .36, COND, sz, GLASS, 'middle', .08);
    }
    if (has(o, 'screen')) s += screen();
    if (o.custom && o.custom.front) s += customSvg(o.custom.front, { L: w, Hh, box: (x0, h0, x1, h1) => ({ x: x0, y: Y(h1), w: x1 - x0, h: h1 - h0 }), flip: false });
    if (has(o, 'bonnet')) s += logoSvg({ x: w * .27, y: Y(hh + 3), w: w * .46, h: 22 }, .9);
    return s;
  }

  const nest = (inner, vb, x, y, w) => { const h = w * vb[3] / vb[2]; return { s: `<svg x="${r2(x)}" y="${r2(y)}" width="${r2(w)}" height="${r2(h)}" viewBox="${vb.join(' ')}">${inner}</svg>`, h }; };

  // ---------- page parts ----------
  const navy = isSA ? SA.char : C.navy, accent = isSA ? SA.red : C.yellow;
  function header(eyebrow, title, tag) {
    let s = `<rect width="${W}" height="150" fill="${C.paper}"/>`;
    s += isSA ? T('SPEED ARMY', M, 102, HEAD, 66, SA.red) : `<svg x="${M}" y="37" width="380" height="76" viewBox="0 0 981 196">${VE_LOGO}</svg>`;
    s += T('PROOF · ' + (J.date || '').toUpperCase(), W - M, 88, EYE, 36, navy, 'end');
    s += `<rect y="150" width="${W}" height="230" fill="${navy}"/>`;
    s += T(eyebrow.toUpperCase(), M, 208, EYE, 34, accent, 'start', .14);
    const size = Math.min(118, fit(title + ' ' + tag, HEAD, W - 2 * M - 60, 118));
    s += T(title, M, 330, HEAD, size, C.paper);
    const x = M + tw(title + ' ', HEAD, size) + 10, tws = tw(tag, HEAD, size);
    s += `<rect x="${r2(x - 16)}" y="${r2(330 - size * .82)}" width="${r2(tws + 36)}" height="${r2(size * .98)}" fill="${accent}"/>`;
    s += T(tag, x, 330, HEAD, size, isSA ? '#fff' : C.navy);
    return s;
  }
  const label = (x, y, t) => T(t.toUpperCase(), x, y + 27, EYE, 34, C.navy, 'start', .14);
  function footer(t) {
    const fs = Math.min(42, fit(t, BODYB, W - 2 * M, 42)); let s = `<rect y="${H - 200}" width="${W}" height="100" fill="${navy}"/>` + T(t, M, H - 150 + fs * .36, BODYB, fs, C.paper);
    s += `<rect y="${H - 100}" width="${W}" height="100" fill="${accent}"/>`;
    s += T(isSA ? 'Speed Army · eBay: speedarmy' : 'Vector Edge · 07348 580 359 · vectoredge.co.uk', W / 2, H - 36, BODYB, 40, isSA ? '#fff' : C.navy, 'middle');
    return s;
  }
  function priceCard(x0, y0, x1, y1, title, o, stacked) {
    let s = `<rect x="${x0}" y="${r2(y0)}" width="${x1 - x0}" height="${r2(y1 - y0)}" fill="${C.paper}"/><rect x="${x0}" y="${r2(y0)}" width="12" height="${r2(y1 - y0)}" fill="${accent}"/>`;
    const showPrice = !isSA && o.price != null;
    const ttl = `${title} · ${o.mode || (isSA ? 'PROOF' : 'FITTED')}`;
    s += T(ttl, x0 + 44, y0 + 48, HEAD, Math.min(34, fit(ttl, HEAD, stacked ? x1 - x0 - 80 : 450, 34)), C.grey);
    let ty = y0 + 92;
    if (showPrice) {
      const p = '£' + o.price;
      s += T(p, x0 + 44, y0 + 128, HEAD, 88, C.navy);
      if (o.posted != null) s += T('POSTED £' + o.posted, x0 + 44 + tw(p, HEAD, 88) + 28, y0 + 128, EYE, 34, C.grey, 'start', .06);
      ty = stacked ? y0 + 196 : y0 + 64;
    }
    const tx = (showPrice && !stacked) ? x0 + 520 : x0 + 44, fs = stacked ? 34 : 36;
    wrap(o.line || '', BODY, fs, x1 - tx - 30).forEach((ln, i) => s += T(ln, tx, ty + i * 44, BODY, fs, C.navy));
    return s;
  }
  const wrapPage = s => `<svg class="page" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">${tplDefs()}<rect width="${W}" height="${H}" fill="#fff"/>${s}</svg>`;
  const n = J.options.length;
  const vanLabel = (J.van && J.van.label) || 'VAN';

  const WD = (J.word || 'OPTION').toUpperCase();
  const N0 = (J.first || 1) - 1;   // "first": 11 numbers the options from 11 (style sheets)
  // more than 3 options: a gallery, 6 per page (2 x 3)
  function gallery(p, pages) {
    const from = p * 6, list = J.options.slice(from, from + 6);
    let s = header(`${vanLabel} · ${n} ${WD}S · PAGE ${p + 1} OF ${pages}`, J.customer || B.name || '', `${n} ${WD}S`);
    const vb = sideVB(), cw = (W - 2 * M - 40) / 2, top = 400, ch = (H - 212 - top) / 3;
    list.forEach((o, j) => {
      const i = from + j, x = M + (j % 2) * (cw + 40), y = top + Math.floor(j / 2) * ch;
      s += `<rect x="${x - 14}" y="${r2(y)}" width="${r2(cw + 28)}" height="${r2(ch - 16)}" fill="${C.paper}" rx="6"/>`;
      s += T(`${i + 1 + N0}`, x + 4, y + 62, HEAD, 64, accent === C.yellow ? C.navy : accent);
      s += T(o.name, x + 70, y + 46, HEAD, 40, C.navy);
      const v = nest(side(o, false), vb, x, y + 66, cw), pr = (!isSA && o.price != null) ? '£' + o.price : '';
      s += v.s;
      const ty = y + 66 + v.h + 30;
      if (pr) s += T(pr, x + 4, ty + 10, HEAD, 50, C.navy);
      let tx = x + 4 + (pr ? tw(pr, HEAD, 50) + 14 : 0);
      if (pr && o.posted != null) {   // posted (self-fit) price, small, under a "POSTED" label
        s += T('POSTED', tx, ty - 14, EYE, 18, C.grey, 'start', .08) + T('£' + o.posted, tx, ty + 10, HEAD, 28, C.grey);
        tx += Math.max(tw('POSTED', EYE, 18, .08), tw('£' + o.posted, HEAD, 28)) + 18;
      }
      wrap(o.line || '', BODY, 24, x + cw - tx).slice(0, 2).forEach((ln, k) => s += T(ln, tx, ty - 8 + k * 29, BODY, 24, C.grey));
    });
    return wrapPage(s + footer(J.footer || ''));
  }

  function overview() {
    let s = header(`${vanLabel} · ${n} OPTIONS · ${J.service || ''}`, J.customer || B.name || '', `${n} OPTIONS`);
    const top = 408, bottom = H - 212, vb = sideVB(), ratio = vb[3] / vb[2];
    const per = (bottom - top) / n, vw = Math.min(860, (per - 60) / ratio);
    let y = top;
    J.options.forEach((o, i) => {
      s += label(M, y, `OPTION ${i + 1} · ${o.name}`);
      const v = nest(side(o, false), vb, M - 10, y + 34, vw);
      s += v.s + priceCard(M + vw + 20, y + 60, W - M, y + 34 + v.h - 20, `OPTION ${i + 1}`, o, true);
      y += 34 + v.h + 26;
    });
    return wrapPage(s + footer(J.footer || ''));
  }

  function optionPage(i) {
    const o = J.options[i];
    let s = header(`${vanLabel} · ${n > 1 ? `${WD} ${i + 1 + N0}${N0 ? "" : ` OF ${n}`} · ` : ''}${J.service || ''}`, n > 3 ? o.name : (J.customer || B.name || ''), n > 1 ? `${WD} ${i + 1 + N0}` : 'PROOF');
    let y = 405;
    const sv = sideVB(), ev = endVB();
    s += label(M, y, 'PASSENGER SIDE');
    let v = nest(side(o, false), sv, M + 20, y + 36, W - 2 * M - 40); s += v.s; y += 36 + v.h + 10;
    const ow = 880, gw = 15, rw = (W - 2 * M - ow - 2 * gw) / 2;
    const vo = nest(side(o, true), sv, M, 0, ow), vr = nest(rear(o), ev, 0, 0, rw), vf = nest(front(o), ev, 0, 0, rw);
    const hh = Math.max(vo.h, vr.h, vf.h);
    s += label(M, y, 'DRIVER SIDE') + label(M + ow + gw, y, 'REAR') + label(M + ow + 2 * gw + rw, y, 'FRONT');
    s += nest(side(o, true), sv, M, y + 36 + hh - vo.h, ow).s + nest(rear(o), ev, M + ow + gw, y + 36 + hh - vr.h, rw).s + nest(front(o), ev, M + ow + 2 * gw + rw, y + 36 + hh - vf.h, rw).s;
    y += 36 + hh + 16;
    const ch = Math.min(150, H - 212 - y);
    s += priceCard(M, y, W - M, y + ch, n > 1 ? `${WD} ${i + 1 + N0} · ${o.name}` : o.name, o, false);
    return wrapPage(s + footer(J.footer || ''));
  }

  // ---------- render ----------
  function render() {
    const gp = Math.ceil(n / 6), wd = WD.charAt(0) + WD.slice(1).toLowerCase();
    const first = n > 3 ? Array.from({ length: gp }, (_, p) => gallery(p, gp)) : n > 1 ? [overview()] : [];
    const firstNames = n > 3 ? first.map((_, p) => `All ${p + 1}`) : n > 1 ? ['Overview'] : [];
    const pages = first.concat(J.options.map((_, i) => optionPage(i)));
    const names = n > 1 ? firstNames.concat(J.options.map((o, i) => `${wd} ${i + 1 + N0}`)) : ['Proof'];
    let cur = Math.min(pages.length - 1, Math.max(0, parseInt(q.get('page') || '0', 10) || 0));
    const bar = document.getElementById('bar'), stage = document.getElementById('stage');
    function show(k) {
      cur = k; stage.innerHTML = pages[k];
      [...bar.children].forEach((b, j) => b.classList.toggle('on', j === k));
    }
    bar.innerHTML = names.map(t => `<button>${t}</button>`).join('');
    [...bar.children].forEach((b, j) => b.onclick = () => show(j));
    show(cur);
    document.body.setAttribute('data-ready', '1');
  }
  const fonts = [HEAD, EYE, BODY, BODYB, COND, CONDX, WORD, F('Montserrat', 500), F('Barlow Condensed', 900, 1)].concat(Object.keys(WEIGHT).map(fontOf), J.options.filter(o => o.font).map(o => fontOf(o.font))).map(f => document.fonts.load(`${f.it ? 'italic ' : ''}${f.wt} 40px "${f.fam}"`));
  const src = (!light && J.logoOnDark) ? J.logoOnDark : J.logo;
  const logoReady = new Promise(res => {
    if (!src) return res();
    const im = new Image(); im.onload = () => { LOGO = { src, ar: im.naturalWidth / im.naturalHeight }; res(); }; im.onerror = () => res(); im.src = src;
  });
  Promise.all(fonts.concat([logoReady])).then(render, render);
})();
</script>
</body>
</html>
